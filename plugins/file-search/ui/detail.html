<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文件搜索</title><link rel="stylesheet" href="detail.css"></head>
<body>
<div id="app" class="fs-app">
  <div class="fs-header">
    <div class="fs-heading">
      <h2>文件搜索</h2>
      <p class="fs-status" id="fs-status" hidden></p>
    </div>
    <div class="fs-actions">
      <!-- 选择文件夹：弹系统对话框挑选要搜索的文件夹（宿主并入搜索框附件）。
           旧宿主没有 ms.input.pickFolders 时保持 hidden（能力降级）。 -->
      <button id="fs-pick" class="fs-btn" type="button" hidden>选择文件夹</button>
      <button id="fs-rescan" class="fs-btn" type="button">重新扫描</button>
    </div>
  </div>
  <div class="fs-folders" id="fs-folders" hidden></div>
  <!-- 关键词输入行：插件内直接输入即搜（不必经搜索框「文件搜索 : xx」子搜索模式）。
       回车立即搜；Esc 清空关键词并回到待命态。 -->
  <div class="fs-search" id="fs-search-row">
    <input id="fs-query" class="fs-query" type="text" placeholder="输入关键词筛选文件名（回车立即搜索）"
           autocomplete="off" spellcheck="false" />
    <button id="fs-clear" class="fs-btn" type="button" hidden title="清空关键词">清空</button>
  </div>
  <div class="fs-meta" id="fs-meta" hidden></div>
  <div class="fs-cats" id="fs-cats" hidden></div>
  <div class="fs-list" id="fs-list" hidden></div>
  <div class="fs-foot" id="fs-foot" hidden></div>
</div>
<script src="index.js"></script>
</body>
</html>
