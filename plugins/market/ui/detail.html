<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>插件市场</title><link rel="stylesheet" href="detail.css"></head>
<body>
<div id="app" class="page">
  <header class="topbar market-header">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 36 36" fill="none">
          <path d="M15 4.5a4.5 4.5 0 0 1 9 0V8h6a2 2 0 0 1 2 2v6h3.5a4.5 4.5 0 0 1 0 9H32v6a2 2 0 0 1-2 2h-8v-4a4 4 0 0 0-8 0v4H6a2 2 0 0 1-2-2v-8h4a4 4 0 0 0 0-8H4v-5a2 2 0 0 1 2-2h9V4.5Z" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand-copy">
        <h2>插件市场</h2>
        <p>浏览、安装、管理与更新插件，扩展你的工具能力</p>
      </div>
    </div>
  </header>

  <section class="hero" aria-label="插件市场介绍">
    <div class="hero-copy">
      <h2>插件市场</h2>
      <p>丰富的插件资源，助你扩展功能、提升效率</p>
    </div>
    <span class="hero-shape shape-a" aria-hidden="true"></span>
    <span class="hero-shape shape-b" aria-hidden="true"></span>
    <span class="hero-shape shape-c" aria-hidden="true"></span>
  </section>

  <nav class="tabs" aria-label="插件分类">
    <button class="tab active" data-tab="featured" aria-selected="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2.8 2.8 5.7 6.3.9-4.55 4.44 1.08 6.27L12 17.15l-5.63 2.96 1.08-6.27L2.9 9.4l6.3-.9L12 2.8Z"/></svg>精选
    </button>
    <button class="tab" data-tab="latest" aria-selected="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9l6 4"/><circle cx="12" cy="12" r="9"/></svg>最新
    </button>
    <button class="tab" data-tab="installed" aria-selected="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="15" rx="2"/><path d="M3 9h18M8 3h8M10 13h4"/></svg>已安装
    </button>
  </nav>

  <div class="search-wrap">
    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16.2 16.2 4.5 4.5"/></svg>
    <input class="search" id="market-search" type="search" placeholder="搜索插件：名称、描述、标签、作者..." aria-label="搜索插件" autocomplete="off">
  </div>

  <div id="market-loading" class="market-state market-loading">加载目录中…</div>
  <div id="market-error" class="market-state error" style="display:none"></div>
  <section id="market-list" class="market-plugins" style="display:none" aria-label="插件列表"></section>
  <div id="market-pager" class="market-pager" style="display:none"></div>
</div>
<script src="index.js"></script></body>
</html>
