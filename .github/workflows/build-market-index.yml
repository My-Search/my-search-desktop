name: 构建插件市场索引

# 读取主仓库的 plugins/index.json（人工维护的源清单），解析出每个插件的
# 版本/哈希/下载地址，生成 index.dist.json（客户端读）与 index.error.json（开发者自查），
# **提交到市场仓库** My-Search/my-search-plugin-market。
#
# 客户端从市场仓库的 raw 地址读取索引，所以这里必须提交到市场仓库——
# 提交到本仓库是无效的（客户端读不到）。
#
# 开发者在自己的仓库发版后，最长一小时内市场自动跟进，无需联系我们。
on:
  # 每小时自动构建一次
  schedule:
    - cron: "0 * * * *"
  # 也支持手动触发
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅构建产物、不提交（演练）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  MARKET_REPO: My-Search/my-search-plugin-market

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出主仓库（源清单与工具在这里）
        uses: actions/checkout@v4

      # 必须是 Node 22.6+（本项目用原生 TS 支持直接 import src 下的 .ts，
      # 与 test/pack-plugin.mjs 等工具同一机制；Node 20 会报
      # "Unknown file extension .ts"）
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 构建索引
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-index.mjs

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: market-index
          path: |
            dist/market/index.dist.json
            dist/market/index.error.json

      # 索引要提交到**市场仓库**（客户端从这里读）。
      # 默认 GITHUB_TOKEN 只能写本仓库，因此这里用 MARKET_REPO_TOKEN
      # （PAT，scopes: repo）。
      - name: 提交索引到市场仓库
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.MARKET_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::缺少 MARKET_REPO_TOKEN（需对 $MARKET_REPO 有 contents:write）"
            exit 1
          fi

          # 检出市场仓库到独立目录
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${MARKET_REPO}.git" market-repo

          # 写入生成物；error-item.txt 是旧文件名，一并清理避免残留
          cp dist/market/index.dist.json market-repo/index.dist.json
          cp dist/market/index.error.json market-repo/index.error.json
          rm -f market-repo/error-item.txt

          cd market-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A index.dist.json index.error.json error-item.txt
          if git diff --cached --quiet; then
            echo "索引无变化，跳过提交"
          else
            git commit -m "chore(market): 自动更新插件索引 [skip ci]"
            git push
          fi

      # 若 index.json 因 404 被工具自动改写（移除失效仓库），把改动提交回**本仓库**。
      - name: 提交源清单变更到本仓库
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/index.json
          if git diff --cached --quiet; then
            echo "源清单无变化"
          else
            git commit -m "chore(market): 移除 404 的插件源 [skip ci]"
            git push
          fi
