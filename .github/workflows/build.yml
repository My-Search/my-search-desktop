name: 三平台构建

# 触发方式：
#   - push 到 master：三平台各构建一次安装包，作为 Actions 产物上传（不发 Release，
#     避免覆盖已发布版本的同名 Release 资产）；
#   - push v* tag：三平台构建并创建/更新对应 Release（正式发版走这条）；
#   - workflow_dispatch：手动触发，按当前 ref 走上面两条中匹配的那条。
#
# 注意：插件（.mspp）的打包与市场索引构建**不在本仓库**进行，
# 见市场仓库 My-Search/my-search-plugin-market 的「构建插件市场索引」工作流。
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # macOS aarch64 build — runs first to create the release
  build-macos-aarch64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装前端依赖
        run: npm install

      - name: 构建并发布 Release（tag 推送）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "我的搜索 v__VERSION__"
          releaseBody: "我的搜索桌面版 - 订阅式搜索"
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: 构建安装包（分支推送，仅产出产物）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx tauri build --target aarch64-apple-darwin

      - name: 上传安装包
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: my-search-macos-aarch64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/**

  # macOS x86_64 build — runs after aarch64 to avoid release race
  build-macos-x86_64:
    needs: [build-macos-aarch64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装前端依赖
        run: npm install

      - name: 构建并发布 Release（tag 推送）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "我的搜索 v__VERSION__"
          releaseBody: "我的搜索桌面版 - 订阅式搜索"
          releaseDraft: false
          prerelease: false
          args: --target x86_64-apple-darwin

      - name: 构建安装包（分支推送，仅产出产物）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx tauri build --target x86_64-apple-darwin

      - name: 上传安装包
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: my-search-macos-x86_64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/**

  # Linux & Windows builds — run after macOS builds are done to avoid
  # tauri-action release-upload race (both macOS and this job create/upload
  # to the same tag; without serialization some artifacts get silently dropped).
  build:
    needs: [build-macos-x86_64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""
            artifact: my-search-linux
          - platform: "windows-latest"
            args: ""
            artifact: my-search-windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装前端依赖
        run: npm install

      - name: 构建并发布 Release（tag 推送）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "我的搜索 v__VERSION__"
          releaseBody: "我的搜索桌面版 - 订阅式搜索"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: 构建安装包（分支推送，仅产出产物）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx tauri build ${{ matrix.args }}

      - name: 上传安装包
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
