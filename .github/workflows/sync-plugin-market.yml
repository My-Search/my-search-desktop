name: 同步插件市场

# 按 plugins/sources.json 的准入名单，从各开发者仓库拉取最新插件包，
# 校验并重算哈希，更新市场目录（catalog.json）。
#
# 开发者在自己的仓库发版后，最长一小时内市场自动跟进——无需开发者联系我们。
on:
  # 每小时自动同步一次
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "只同步指定插件 id（留空=全部）"
        required: false
        default: ""
      dry_run:
        description: "仅生成产物、不上传（演练）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 同步工具用 gh 拉取各开发者仓库的包，需要能读公开仓库；
      # 发布又需要写市场仓库，因此统一用 MARKET_REPO_TOKEN。
      - name: 同步并生成目录
        env:
          GH_TOKEN: ${{ secrets.MARKET_REPO_TOKEN }}
          INPUT_ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::缺少 MARKET_REPO_TOKEN（需对市场仓库有 contents:write，且能读待同步的公开仓库）"
            exit 1
          fi
          if [ -n "${INPUT_ONLY:-}" ]; then
            node scripts/sync-sources.mjs --only "$INPUT_ONLY"
          else
            node scripts/sync-sources.mjs
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: market-catalog
          path: dist/market/

      # 定时任务始终发布；手动触发时尊重 dry_run
      - name: 发布目录
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.MARKET_REPO_TOKEN }}
        run: |
          set -euo pipefail
          bash dist/market/publish.sh
