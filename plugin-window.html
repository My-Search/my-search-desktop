<!doctype html>
<html lang="zh-CN" class="ms-plugin-window-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>插件窗口</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        var theme = "system";
        try {
          var raw = localStorage.getItem("my-search-desktop:theme");
          if (raw != null) {
            var parsed = JSON.parse(raw);
            if (parsed === "light" || parsed === "dark" || parsed === "system") {
              theme = parsed;
            }
          }
        } catch (e) {}
        var dark =
          theme === "dark" ||
          (theme === "system" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "theme-dark" : "theme-light");
        document.documentElement.style.backgroundColor = dark ? "#17191d" : "#f5f6f8";
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--surface, #f5f6f8);
        color: var(--text, #1f2329);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #plugin-window-root {
        width: 100%;
        min-height: 100vh;
        box-sizing: border-box;
      }
      .ms-pw-toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 13px;
        background: rgba(25, 28, 34, 0.92);
        color: #fff;
        z-index: 9999;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      .ms-pw-toast.is-error {
        background: #c93b3b;
      }
      .ms-pw-error {
        padding: 24px;
        font-size: 14px;
        color: var(--danger, #d9534f);
      }
    </style>
  </head>
  <body>
    <div id="plugin-window-root" class="plugin-view"></div>
    <script type="module" src="/src/plugin-window.ts"></script>
  </body>
</html>
